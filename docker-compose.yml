name: induinventory

services:
  postgres:
    image: postgres:17.2-alpine
    container_name: induinventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: induinventory
      POSTGRES_PASSWORD: induinventory_dev_password
      POSTGRES_DB: induinventory
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U induinventory -d induinventory']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    container_name: induinventory-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
